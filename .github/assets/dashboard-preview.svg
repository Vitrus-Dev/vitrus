<text x="514.8399999999999" y="402" class="m" font-size="10" fill="#b9bdc4" xml:space="preserve">SELECT channel,</text>
<text x="514.8399999999999" y="415.5" class="m" font-size="10" fill="#b9bdc4" xml:space="preserve">       COUNT(DISTINCT session_id) AS sessions</text>
<text x="514.8399999999999" y="429" class="m" font-size="10" fill="#b9bdc4" xml:space="preserve">  FROM events</text>
<text x="514.8399999999999" y="442.5" class="m" font-size="10" fill="#b9bdc4" xml:space="preserve"> WHERE site_id = ?</text>
<text x="514.8399999999999" y="456" class="m" font-size="10" fill="#b9bdc4" xml:space="preserve">   AND ts >= ? AND ts &lt; ?</text>
<text x="514.8399999999999" y="469.5" class="m" font-size="10" fill="#b9bdc4" xml:space="preserve">   AND bot_kind = ''</text>
<text x="514.8399999999999" y="483" class="m" font-size="10" fill="#b9bdc4" xml:space="preserve"> GROUP BY channel</text>
<text x="506.84" y="533" class="f dim" font-size="10">Click any number and this is what opens.</text>
