       <line x1="202" y1="401" x2="454.8" y2="401" stroke="#1a2028"/>
<text x="202" y="416" class="f dim" font-size="11.5">Direct</text>
       <text x="454.8" y="416" class="f fg" font-size="11.5" text-anchor="end">846</text>
       <line x1="202" y1="423" x2="454.8" y2="423" stroke="#1a2028"/>
