       <text x="454.8" y="438" class="f fg" font-size="11.5" text-anchor="end">638</text>
       
<rect x="478.8" y="330" width="421.2" height="214" rx="9" fill="#12161b" stroke="#2f6b5d"/>
     <text x="492.8" y="350" class="f" font-size="10" fill="#5bc8af" letter-spacing="0.9">e8 — THE QUERY THAT RAN</text>
     <rect x="490.8" y="360" width="397.2" height="152" rx="6" fill="#0b0e12" stroke="#1e242c"/>
<text x="500.8" y="378" class="m" font-size="10" fill="#b6c2ce">SELECT channel,</text>
<text x="500.8" y="392" class="m" font-size="10" fill="#b6c2ce">       COUNT(DISTINCT session_id) AS sessions</text>
<text x="500.8" y="406" class="m" font-size="10" fill="#b6c2ce">  FROM events</text>
<text x="500.8" y="420" class="m" font-size="10" fill="#b6c2ce"> WHERE site_id = ?</text>
<text x="500.8" y="434" class="m" font-size="10" fill="#b6c2ce">   AND ts >= ? AND ts &lt; ?</text>
<text x="500.8" y="448" class="m" font-size="10" fill="#b6c2ce">   AND bot_kind = ''</text>
<text x="500.8" y="462" class="m" font-size="10" fill="#b6c2ce"> GROUP BY channel</text>
<text x="492.8" y="532" class="f dim" font-size="10">Click any number and this is what opens.</text>
</svg>